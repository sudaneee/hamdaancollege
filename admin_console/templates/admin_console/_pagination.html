{% if page_obj.has_other_pages %}
<div style="display:flex;justify-content:center;gap:8px;margin-top:16px;">
  {% if page_obj.has_previous %}
    <a href="?{{ querystring }}page={{ page_obj.previous_page_number }}" class="btn btn-outline btn-sm">&laquo; Prev</a>
  {% endif %}
  <span style="align-self:center;font-size:13px;color:var(--muted);">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?{{ querystring }}page={{ page_obj.next_page_number }}" class="btn btn-outline btn-sm">Next &raquo;</a>
  {% endif %}
</div>
{% endif %}
